name: Deploy Web Version

# Publishes the web version (npm run pack:web) to Cloudflare Pages when a release is published:
# a full release goes to production (fwmb.filroden.com), a pre-release to the project's preview
# address only. It can also be run by hand from the Actions tab for any tag.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with Account > Cloudflare Pages >
# Edit) and CLOUDFLARE_ACCOUNT_ID. The Pages project must be a Direct Upload project.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (for example v4.0.0)'
        required: true
      production:
        description: 'Deploy to production (otherwise to the preview address)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  # The Cloudflare Pages project the web version is published to
  PAGES_PROJECT: fwmb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Work out what to deploy
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then echo "branch=preview" >> "$GITHUB_OUTPUT"; else echo "branch=main" >> "$GITHUB_OUTPUT"; fi
          else
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.production }}" = "true" ]; then echo "branch=main" >> "$GITHUB_OUTPUT"; else echo "branch=preview" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pack the web version
        run: npm run pack:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.target.outputs.branch }}
